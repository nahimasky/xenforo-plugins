name: Extract plugin archives

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract ZIP archives
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          archives=( *.zip )

          if [ ${#archives[@]} -eq 0 ]; then
            echo "No ZIP archives found."
            exit 0
          fi

          for archive in "${archives[@]}"; do
            folder="${archive%.zip}"
            echo "Extracting $archive into $folder/"
            mkdir -p "$folder"
            unzip -oq "$archive" -d "$folder"
          done

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract plugin archives into separate folders"
          git push