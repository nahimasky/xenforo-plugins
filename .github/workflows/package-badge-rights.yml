name: Package Badge Rights 1.1.4

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create plugin ZIP
        run: |
          set -euo pipefail
          cd Sky-BadgeRights-1_1_3
          zip -qr ../Sky-BadgeRights-1.1.4.zip upload

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sky-BadgeRights-1.1.4
          path: Sky-BadgeRights-1.1.4.zip
          if-no-files-found: error
          retention-days: 30